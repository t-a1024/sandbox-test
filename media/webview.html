<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src %BASE_URI% https: data:; style-src 'unsafe-inline' %BASE_URI% https:; script-src 'nonce-%NONCE%' https:; connect-src https: http: ws: %BASE_URI%;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="%STYLE_URI%" rel="stylesheet" />
  <title>Sandbox (Monaco + Config)</title>
  <!-- 言語設定をインラインで注入 -->
  %LANG_CONFIG_SCRIPT%
</head>
<body>
  <div class="toolbar">
    <!-- options を main.js が動的に追加 -->
    <select id="langSelect"></select>
    <button id="runBtn">Run</button>
    <button id="loadTemplateBtn">Load Template</button>
  </div>

  <div class="cmd-area">
    <textarea id="execCommand" placeholder="実行コマンドをここに記述。{file} がテンポラリファイル名に置換されます。"></textarea>
    <div class="note">
      <div>説明: `{file}` は一時ファイル名に置換されます。</div>
      <div>例: <code>node {file}</code>、<code>ts-node {file}</code>、<code>gcc {file} -o a.out && ./a.out</code></div>
    </div>
  </div>

  <div id="editor" class="editor"></div>

  <div class="output">
    <div class="output-header">Output</div>
    <pre id="outputArea" class="output-area"></pre>
  </div>

  <script nonce="%NONCE%" src="%SCRIPT_URI%"></script>
</body>
</html>
